<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>maplibre-gl-handwriting dev</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
      }

      #map {
        position: fixed;
        inset: 0;
      }

      .dev-panel {
        position: absolute;
        top: 8px;
        left: 8px;
        display: grid;
        gap: 4px;
        justify-items: start;
        padding: 8px 12px;
        font-size: 14px;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 6px;
      }

      .dev-panel .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        align-items: center;
      }

      .dev-panel p {
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
